# Weka trace replay with tool gaps executed on GKE Agent Substrate actors.
# LLM calls go to llm-d (through the Inference Gateway); see
# docs/substrate_tool_execution.md for the in-cluster setup this needs.
load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 16
      num_sessions: 64
  num_workers: 4
  worker_max_concurrency: 100
  request_timeout: 300
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-32B
  base_url: http://inference-gateway.llm-d.svc.cluster.local
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-32B
data:
  type: weka_trace_replay
  weka_trace_replay:
    hf_dataset_path: semianalysisai/cc-traces-weka-with-subagents-060826-256k
    num_dataset_entries: 64
    use_static_model: true
    static_model_name: Qwen/Qwen3-32B
    tool_executor:
      type: substrate
      idle_gap_threshold_ms: 5000
      actor:
        # Main agent and most subagents share the session's actor; code-search
        # subagents get a sandbox of their own.
        assignment:
          default: session
          rules:
            - match: {gen_ai.agent.name: "Explore"}
              assign: dedicated
        suspend:
          between_turns: true
          after_each_tool_call: false
          snapshot_durability: async
        tool_call:
          command_template: "sleep {duration_sec:.3f}"
      substrate:
        atespace: inference-perf
        actor_template: python-runtime
        api:
          endpoint: api.ate-system.svc:443
          ca_path: /run/servicedns-ca/ca.crt
          token_path: /run/ate-token/token
        router:
          url: https://atenet-router.ate-system.svc
          ca_path: /run/router-ca/ca.crt
          cert_bundle_path: /run/podidentity.podcert.ate.dev/credential-bundle.pem
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
    per_request_fields:
      request: false
      response: false
      response_chunks: false
      info: true
      computed_metrics: true
  session_lifecycle:
    summary: true
    per_session: true
