# vLLM serving Qwen3-0.6B on one spot L4 GPU: the LLM backend for the PoC run.
# YaRN x4 extends the 32K native context to 128K so TraceLab's Claude Code
# prompts (up to ~120K tokens in the slice) fit.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      # A Service named "vllm" would inject VLLM_PORT=tcp://..., which vLLM rejects.
      enableServiceLinks: false
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-spot: "true"
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule}
      containers:
      - name: vllm
        image: docker.io/vllm/vllm-openai:v0.31.0
        env:
        - {name: LD_LIBRARY_PATH, value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64}
        args:
        - --model=Qwen/Qwen3-0.6B
        - --served-model-name=Qwen/Qwen3-0.6B
        - --max-model-len=131072
        - --hf-overrides={"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}
        - --enable-prefix-caching
        - --gpu-memory-utilization=0.92
        - --port=8000
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 90
        resources:
          limits: {nvidia.com/gpu: 1}
          requests: {cpu: "4", memory: 16Gi}
        volumeMounts:
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm
spec:
  selector: {app: vllm}
  ports:
  - {port: 8000, targetPort: 8000}
