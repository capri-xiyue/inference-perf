apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimized-baseline-nvidia-gpu-vllm-decode
spec:
  # One FP8 replica per H100: 4 on a3-highgpu-4g, 8 on a3-megagpu-8g.
  replicas: 4
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-accelerator
                    operator: In
                    values: [nvidia-h100-80gb, nvidia-h100-mega-80gb]
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: modelserver
          args:
            - "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
            - "--served-model-name=Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=1"
            - "--max-model-len=262144"
            - "--gpu-memory-utilization=0.92"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
            - "--shutdown-timeout=45"
          resources:
            limits: {cpu: '10', memory: 110Gi, nvidia.com/gpu: 1}
            requests: {cpu: '8', memory: 96Gi, nvidia.com/gpu: 1}
