# inference-perf run against real GKE Agent Substrate. Modeled on the repo's
# helm chart (deploy/inference-perf): config.yml from a ConfigMap, command
# `inference-perf --config_file ...`. Adds the Substrate client identity: a pod
# certificate (mTLS to ateapi and atenet-router) and the servicedns CA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-config
  namespace: ip-bench
data:
  config.yml: |
    load:
      type: trace_session_replay
      stages:
        - concurrent_sessions: 12
          num_sessions: 24
      num_workers: 2
      worker_max_concurrency: 100
      request_timeout: 900
      stage_teardown_grace_seconds: 120
    api:
      type: chat
      streaming: true
    server:
      type: vllm
      model_name: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
      base_url: http://GATEWAY_ADDRESS        # llm-d inference gateway
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
    data:
      type: tracelab_trace_replay
      tracelab_trace_replay:
        trace_files: ["/data/tracelab.jsonl"]
        use_static_model: true
        static_model_name: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
        filter: "lambda x: x['max_tokens'] < 262144"   # skip sessions that do not fit the model
        trace_idle_gap_cap_seconds: null               # replay every gap as recorded
    sandbox:
      type: substrate
      actor:
        name_prefix: ip
        suspend:
          between_turns: true
          after_each_tool_call: false
          snapshot_durability: async
      substrate:
        atespace: ip-bench
        actor_template: python-runtime
        api:
          endpoint: api.ate-system.svc:443
          server_name: api.ate-system.svc
          ca_path: /run/ate/ca.crt
          cert_bundle_path: /run/ate/credential-bundle.pem
        router:
          url: https://atenet-router.ate-system.svc
          ca_path: /run/ate/ca.crt
          cert_bundle_path: /run/ate/credential-bundle.pem
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
        per_request_fields:
          request: false
          response: false
          response_chunks: false
          info: true
          computed_metrics: true
      session_lifecycle:
        summary: true
        per_stage: false
        per_session: true
    storage:
      local_storage:
        path: /reports/run
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf
  namespace: ip-bench
  labels: {app: inference-perf}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: inference-perf}
    spec:
      restartPolicy: Never
      serviceAccountName: inference-perf
      nodeSelector:
        cloud.google.com/gke-nodepool: bench
      containers:
      - name: inference-perf-container
        image: IMAGE
        command: ["sh", "-c"]
        # Keep the pod around after the run so the reports can be copied out.
        args:
        - inference-perf --config_file /etc/inference-perf/config.yml --log-level INFO; echo "EXIT=$?"; sleep 14400
        resources:
          requests: {cpu: "4", memory: 8Gi}
        volumeMounts:
        - {name: config, mountPath: /etc/inference-perf, readOnly: true}
        - {name: trace, mountPath: /data, readOnly: true}
        - {name: ate-client, mountPath: /run/ate, readOnly: true}
        - {name: reports, mountPath: /reports}
      volumes:
      - name: config
        configMap: {name: inference-perf-config}
      - name: trace
        configMap: {name: tracelab-trace}
      - name: reports
        emptyDir: {}
      - name: ate-client
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels: {podcert.ate.dev/canarying: live}
              path: ca.crt
